name: Apply verified roadmap patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out assembly branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-open-roadmap
          fetch-depth: 0

      - name: Apply verified patch set
        shell: bash
        run: |
          set -euo pipefail
          for patch in $(find .agent/patches -type f -name '*.patch' | sort); do
            echo "Applying $patch"
            if [ "$patch" = ".agent/patches/01.patch" ]; then
              git apply --check --exclude='.github/workflows/*' "$patch"
              git apply --exclude='.github/workflows/*' "$patch"
            else
              git apply --check "$patch"
              git apply "$patch"
            fi
          done
          rm -rf .agent/patches

      - name: Commit assembled implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete remaining roadmap implementation [agent-applied]"
          git push origin HEAD:agent/complete-open-roadmap
