name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and refresh lockfile
        run: npm install --no-audit --no-fund

      - name: Verify dependency lockfile is committed
        run: |
          if ! git diff --exit-code -- package.json package-lock.json; then
            echo "::error::package.json and package-lock.json are out of sync. Run npm install locally and commit both files together."
            exit 1
          fi

      - name: Run all checks and tests
        run: npm run test:all
