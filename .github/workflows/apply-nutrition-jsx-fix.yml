name: Apply nutrition JSX fix

on:
  push:
    branches:
      - agent/fix-nutrition-web-bundle
    paths:
      - '.github/agent-patches/fix-nutrition-jsx.patch.b64'
      - '.github/workflows/apply-nutrition-jsx-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and validate patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/agent-patches/fix-nutrition-jsx.patch.b64 > /tmp/fix-nutrition.patch
          git apply --check /tmp/fix-nutrition.patch

      - name: Apply fix and run regression suite
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/fix-nutrition.patch
          node --test
          git diff --check
          ! grep -R "forod\.brand" 'app/(tabs)/nutrition.tsx'
          ! grep -F "F{ '}" 'app/(tabs)/nutrition.tsx'

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/agent-patches/fix-nutrition-jsx.patch.b64
          rm -f .github/workflows/apply-nutrition-jsx-fix.yml
          rmdir .github/agent-patches 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix nutrition web bundle syntax"
          git push origin HEAD:agent/fix-nutrition-web-bundle
